<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QOMAR - Pembelajaran Bahasa Arab Berbasis Komik Digital</title>
    <meta name="description"
        content="QOMAR (Qira'atu-l-Komik Lughatul Arabiyah) adalah platform pembelajaran Bahasa Arab berbasis komik digital interaktif untuk siswa kelas IV Madrasah Ibtidaiyah (MI) dengan pendekatan Universal Design for Learning (UDL).">

    <!-- Google Fonts: Inter (Latin) & Amiri (Arabic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Inline script to prevent FOUC for UDL accessibility preferences -->
    <script>
        (function() {
            try {
                var scale = localStorage.getItem('fontScale') || '100';
                var savedDyslexia = localStorage.getItem('dyslexiaMode');
                document.documentElement.classList.add('font-scale-' + scale);
                if (savedDyslexia === 'true') {
                    document.documentElement.classList.add('dyslexia-mode');
                }
            } catch (e) {}
        })();
    </script>

    <!-- PWA Settings -->
    <meta name="theme-color" content="#00A8E8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="QOMAR">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">

    <!-- Link CSS Utama -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/welcome.css">
</head>

<body class="bg-pattern welcome-body">

    <!-- Animated Background Blobs -->
    <div class="welcome-blob welcome-blob-1" aria-hidden="true"></div>
    <div class="welcome-blob welcome-blob-2" aria-hidden="true"></div>
    <div class="welcome-blob welcome-blob-3" aria-hidden="true"></div>

    <main class="welcome-container">
        <header id="welcome-card" class="welcome-card glass-card-strong animate-fade-in-up">

            <!-- Top Badge -->
            <div class="top-badge-container animate-fade-in">
                <span class="top-badge">Kelas IV MI • Bahasa Arab</span>
            </div>

            <!-- Floating Logo Ring -->
            <div id="logo-outer" class="welcome-logo-outer">
                <div class="welcome-logo-inner">
                    <img src="Public/Image/logo.webp" alt="Logo QOMAR" class="welcome-logo-img" fetchpriority="high" decoding="async">
                </div>
            </div>

            <!-- Welcome Header Info -->
            <div class="welcome-header">
                <h1 class="welcome-title-large">QOMAR</h1>
                <h2 class="welcome-subtitle-large">Qira'atu-l-Komik Lughatul Arabiyah</h2>
                <p class="welcome-desc-large">Platform Pembelajaran Bahasa Arab Berbasis <span>Komik Digital &
                        UDL</span></p>
            </div>

            <!-- Enter CTA Button -->
            <div class="welcome-action-area">
                <a href="Public/Page/dashboard.html" id="btn-start-learning" class="welcome-btn">
                    <span>Mulai Belajar</span>
                    <svg class="welcome-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </a>
                <button type="button" class="btn-install-pwa-welcome" data-pwa-install aria-label="Pasang Aplikasi QOMAR di Perangkat">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span>Pasang Aplikasi</span>
                </button>
            </div>

            <!-- Footer Badge -->
            <footer class="welcome-footer-info">
                &copy; 2026 Smart Web QOMAR — Ocktavia Annisa / UNIDA
            </footer>
        </header>
    </main>

    <!-- UDL Settings sync script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const scale = localStorage.getItem('fontScale') || '100';
            const savedDyslexia = localStorage.getItem('dyslexiaMode');

            document.documentElement.className = `font-scale-${scale}`;
            if (savedDyslexia === 'true') {
                document.body.classList.add('dyslexia-mode');
            }
        });
    </script>
    <!-- PWA Helper Script -->
    <script src="js/pwa.js" defer></script>
</body>

</html>
